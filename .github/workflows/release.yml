name: Release
on:
  push:
    branches:
      - main
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout repo
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1" # v7.1.0
        with:
          node-version: "24.22.1" # CVE-2026-111497 (Brotli OOB write) fixed in 24.22.1

      - name: Check package version
        id: check
        uses: "EndBug/version-check@d17247dd94ca7b39d0b0691399be8d7c510622c9" # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          diff-search: true

      - name: Create release
        uses: "zendesk/action-create-release@d690a6dcc904617a6ef45f845114e6e3d9f1b0af" # v1
        if: ${{ steps.check.outputs.changed == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.check.outputs.version}}
          release_name: v${{ steps.check.outputs.version}}
          draft: false
          prerelease: false
