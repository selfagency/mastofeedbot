name: CI
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

      - name: Setup Node
        uses: "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1" # v7.1.0
        with:
          node-version: "24.22.1" # CVE-2026-111497 (Brotli OOB write) fixed in 24.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      - name: Build
        run: npm run build

  fallow-audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1" # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Fallow audit
        # base hardcoded: this repo PRs only against main; interpolating github.base_ref into shell is semgrep-flagged injection
        run: npx fallow audit --base origin/main
