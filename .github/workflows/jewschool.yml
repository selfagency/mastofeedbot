name: Jewschool.com
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
concurrency:
  group: jewschool
  cancel-in-progress: false
jobs:
  jewschool:
    runs-on: ubuntu-latest
    steps:
      - name: Generate cache key
        uses: "actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71" # v9.0.0
        id: generate-key
        with:
          script: |
            core.setOutput('cache-key', new Date().valueOf())

      - name: Retrieve cache
        uses: "actions/cache@caa296126883cff596d87d8935842f9db880ef25" # v5.1.0
        with:
          path: ${{ github.workspace }}/mastofeedbot
          key: feed-cache-${{ steps.generate-key.outputs.cache-key }}
          restore-keys: feed-cache-

      - name: Jewschool.com
        uses: "selfagency/mastofeedbot@0f3e75a22e5224c6ab92a71bd283fd0fc65de9c0" # main at modernize PR #42 merge; bump deliberately after upstream changes
        with:
          rss-feed: https://feeds.feedburner.com/jewschool/feed
          api-endpoint: https://kibitz.cloud
          api-token: ${{ secrets.JEWSCHOOL_MASTO_TOKEN }}
          cache-file: ${{ github.workspace }}/mastofeedbot/cache.json
