name: "MastoFeedBot"
author: "selfagency"
description: "Push RSS feed updates to Mastodon via GitHub Actions"
branding:
  icon: "rss"
  color: "orange"
inputs:
  rss-feed:
    description: "RSS feed URL"
    required: true
  status-format:
    description: "Status text template; tokens {{title}}, {{link}} and {{description}} are replaced ({{title}} {{link}} by default)"
    required: false
    default: "{{title}} {{link}}"
  language:
    description: "ISO 639 status language; falls back to the feed language when omitted"
    required: false
    default: ""
  sensitive:
    description: "Mark statuses as sensitive (true/false); forced when spoiler-text is set"
    required: false
    default: "false"
  spoiler-text:
    description: "Content warning text for all statuses (empty = none)"
    required: false
    default: ""
  attach-enclosures:
    description: "Attach image enclosures as media (true/false)"
    required: false
    default: "true"
  dry-run:
    description: "Log what would be posted without touching the Mastodon API or the cache (true/false)"
    required: false
    default: "false"
  status-visibility:
    description: "Visibility of the posted status (public | unlisted | private | direct)"
    required: false
    default: "public"
  cache-file:
    description: "Cache file"
    required: true
  cache-limit:
    description: "Cache limit"
    required: false
    default: "100"
  api-endpoint:
    description: "Mastodon API endpoint"
    required: true
  api-token:
    description: "Mastodon access token"
    required: true
runs:
  using: "node24"
  main: "dist/index.js"
